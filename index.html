<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feierabend-Fit">
<title>Feierabend-Fit – 15 Minuten Muskelaufbau</title>
<link rel="stylesheet" href="fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f3f4f6;--surface:#ffffff;--surface2:#e6e9ee;--fg:#0a0a0a;--muted:#59616b;--line:#d6d9df;
  --accent:#0b5cff;--onaccent:#ffffff;--soft:#dbe7ff;--softfg:#0a3fae;--danger:#c4271c;
  --body1:#6a727d;--body2:#2b3138;--bodyfar:#a3abb6;--hot:#0b5cff;--gear:#8b939e;
  --studio:radial-gradient(ellipse at 50% 95%,#ffffff 0%,#eef1f6 55%,#dde2ec 100%);
  --skin1:#f0bf9b;--skin2:#c98d64;--skinfar:#a26f50;--skinedge:#7b4a33;--skinear:#c28a66;--shirt:#f2f4f7;--shorts:#1a2236;--hair:#2b1c14;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050607;--surface:#101217;--surface2:#1a1d24;--fg:#ffffff;--muted:#8d949e;--line:#252932;
    --accent:#2f7bff;--onaccent:#ffffff;--soft:#12264d;--softfg:#9cc1ff;--danger:#ff7b72;
    --body1:#f6f8fb;--body2:#aeb5c0;--bodyfar:#626a76;--hot:#2f7bff;--gear:#59616d;
  }
}
:root[data-theme="dark"]{
  --bg:#050607;--surface:#101217;--surface2:#1a1d24;--fg:#ffffff;--muted:#8d949e;--line:#252932;
  --accent:#2f7bff;--onaccent:#ffffff;--soft:#12264d;--softfg:#9cc1ff;--danger:#ff7b72;
  --body1:#f6f8fb;--body2:#aeb5c0;--bodyfar:#626a76;--hot:#2f7bff;--gear:#59616d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.brand{font:800 italic 28px/1 var(--display);letter-spacing:.01em;text-transform:uppercase}
.brand i{font-style:italic;color:var(--accent)}
.date{color:var(--muted);font-size:14px}
.h1{font:800 italic 46px/.92 var(--display);text-transform:uppercase;margin:0 0 8px}
.h2{font:800 italic 26px/1 var(--display);text-transform:uppercase;margin:24px 0 10px}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.hero{border-left:4px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.chip.p{background:var(--soft);color:var(--softfg)}
.meta{display:flex;gap:16px;color:var(--muted);font-size:14px;margin:8px 0 4px}
.meta b{color:var(--fg);font:800 italic 22px var(--display);margin-right:3px}
.btn{appearance:none;border:0;border-radius:10px;padding:16px 20px;font:800 17px var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--onaccent);width:100%;cursor:pointer;margin-top:12px;display:block;text-align:center;text-decoration:none}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.small{width:auto;padding:9px 14px;font-size:15px;margin-top:0;display:inline-block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.wd b{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font:800 italic 20px var(--display);background:var(--surface);border:1.5px solid var(--line);color:var(--fg)}
.wd.done b{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.wd.rest b{color:var(--muted);background:transparent;border-style:dashed}
.wd.today{color:var(--fg);font-weight:700}
.wd.today b{box-shadow:0 0 0 3px var(--soft);border-color:var(--accent)}
.exrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exrow:first-of-type{border-top:0}
.exrow .tx{flex:1;min-width:0}
.exrow strong{display:block;font-size:15px;line-height:1.25}
.exrow span{color:var(--muted);font-size:14px}
.swap{appearance:none;border:1.5px solid var(--line);background:none;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;flex:none}
.fig{width:100%;display:block}
.mini{width:104px;flex:none;background:var(--studio);border-radius:10px;aspect-ratio:16/10}
.figbox{background:var(--studio);border-radius:14px;padding:4px 6px}
.figbox .fig{aspect-ratio:16/10}
svg polyline,svg line,svg rect{fill:none;stroke-linecap:round;stroke-linejoin:round}
.floor{stroke:var(--bodyfar);stroke-width:1.5;opacity:.6}
.prop{stroke:#8a919c;stroke-width:3;fill:none}
.mat{fill:#3f434b;stroke:#2a2d33;stroke-width:1.5;stroke-linejoin:round}
.shd{fill:rgba(20,24,32,.13)}
.sk{fill:url(#skinG);stroke:var(--skinedge);stroke-width:2.2;paint-order:stroke;stroke-linejoin:round}
.sk.far{fill:var(--skinfar)}
.shirt{fill:#22262e;stroke:#0b0d11;stroke-width:1.8;paint-order:stroke;stroke-linejoin:round}
.shorts{fill:#15181d;stroke:#07080a;stroke-width:1.8;paint-order:stroke;stroke-linejoin:round}
.shorts.far{fill:#0e1014}
.shoe{fill:#2b2f37;stroke:#0d0f13;stroke-width:1.8;paint-order:stroke;stroke-linejoin:round}
.shoe.far{fill:#4a505b}
.sole{fill:none;stroke:#f4f6fa;stroke-width:2.4;stroke-linecap:round}
.hair{fill:var(--hair);stroke:none}
.ear{fill:var(--skinear);stroke:var(--skinedge);stroke-width:.8}
.eye{fill:#2a1d16;stroke:none}
.hot,.sec{fill:var(--hot);stroke:none}
.hot{opacity:.62;animation:glow 1.7s ease-in-out infinite}
.sec{opacity:.28}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:.82}}
.gh{fill:#5b636f;stroke:#eef1f6;stroke-width:1.6;paint-order:stroke}
.tw{stroke:var(--muted);stroke-width:2.2;stroke-dasharray:3 3;fill:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--fg)}
.nav button.on svg{stroke:var(--accent)}
details.plan{padding:0;overflow:hidden}
details.plan summary{list-style:none;display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
details.plan summary::-webkit-details-marker{display:none}
details.plan .body{padding:0 16px 16px}
.dn{font:800 italic 26px var(--display);width:38px;flex:none;color:var(--accent)}
details.plan summary div{flex:1}
details.plan summary strong{display:block;font-size:17px}
details.plan summary span{color:var(--muted);font-size:14px}
.ok{font-style:normal;background:var(--accent);color:var(--onaccent);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:14px}
.prow{display:flex;gap:14px;align-items:center;padding:12px 16px;border:1.5px dashed var(--line);border-radius:14px;margin-bottom:12px;color:var(--muted)}
.prow b{font:800 italic 26px var(--display);width:38px;flex:none}
.prow strong{display:block;color:var(--fg);font-size:16px}
.prow span{font-size:14px}
table.mc{width:100%;border-collapse:collapse;font-size:14px}
table.mc th{font-weight:600;color:var(--muted);padding:6px 2px;text-align:center}
table.mc th:first-child,table.mc td:first-child{text-align:left}
table.mc td{padding:8px 2px;border-top:1px solid var(--line);text-align:center}
table.mc td.dot{color:var(--accent);font-size:18px;line-height:1}
table.mc td.cnt{font-weight:700}
table.mc td.cnt.bad{color:var(--danger)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font:800 italic 44px/1 var(--display)}
.stat span{color:var(--muted);font-size:14px}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12.5px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:4px}
.bars i.zero{background:var(--line)}
.bars b{color:var(--fg);font-size:14px}
.hist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hist:first-of-type{border-top:0}
.hist span{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 4px;font-weight:700;font-size:15px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px}
.days button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 0;font-weight:700;cursor:pointer}
.days button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.warn{color:var(--danger);font-size:14px;margin:4px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{appearance:none;width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:25px}
.tip{padding:12px 0;border-top:1px solid var(--line)}
.tip:first-of-type{border-top:0}
.tip strong{display:block}
.tip span{color:var(--muted);font-size:15px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--soft);color:var(--softfg);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;font-weight:600}
.lv5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.lv5 button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 0;font:800 italic 22px var(--display);cursor:pointer}
.lv5 button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.tf{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;margin-bottom:8px;font-size:15px}
.tf input{background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:11px;font-size:16px;width:100%}
/* Sammlung */
.search{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font-size:16px;margin-bottom:10px}
.hs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -16px 4px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--fg)}
.hs button.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.hs button.gear.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.lbl{font-size:13px;color:var(--muted);margin:8px 0 4px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.xc .figbox{padding:2px 4px}
.xc strong{font-size:14.5px;line-height:1.2;padding:0 4px}
.xc .tg{display:flex;flex-wrap:wrap;gap:4px;padding:0 4px 4px}
.tag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.tag.g{background:var(--fg);color:var(--bg)}
.xc .btn{margin:2px 4px 4px;padding:9px 10px;font-size:15px}
/* Sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh .x{float:right;border:0;background:var(--surface2);width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer}
.sh h3{font:800 italic 32px/1 var(--display);text-transform:uppercase;margin:4px 0 4px;padding-right:46px}
.lvl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.lvl:first-of-type{border-top:0}
.lvl span{color:var(--muted);white-space:nowrap}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:8px;font-size:15.5px;font-weight:600;cursor:pointer}
.opt span{color:var(--muted);font-weight:400;font-size:14px}
/* Foto-Darstellung mit weicher Überblendung */
.pic{position:relative;overflow:hidden;display:block;background:var(--studio)}
.pic .zz{position:absolute;inset:0}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-mask-image:radial-gradient(ellipse 76% 82% at 50% 52%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 76% 82% at 50% 52%,#000 62%,transparent 100%)}
.pic img.b{opacity:0;animation:fb var(--d,4.4s) ease-in-out infinite}
@keyframes fb{0%,10%{opacity:0}40%,58%{opacity:1}88%,100%{opacity:0}}
.figbox .pic{aspect-ratio:16/10;border-radius:10px}
.stage .pic{width:100%;height:100%;background:none}
@media (prefers-reduced-motion:reduce){.pic .zz,.pic img{animation:none!important}.pic img.b{opacity:0}}
/* Einrichtung */
#ob{position:fixed;inset:0;background:var(--bg);z-index:25;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ob[hidden]{display:none}
.obw{max-width:560px;margin:0 auto;padding:16px 16px 24px;min-height:100%;display:flex;flex-direction:column}
.obp{display:flex;gap:5px;margin:2px 0 18px}
.obp i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.obp i.on{background:var(--accent)}
.obh{font:800 italic 40px/.95 var(--display);text-transform:uppercase;margin:0 0 8px}
.opts{display:grid;gap:8px;margin:8px 0}
.opts.two{grid-template-columns:1fr 1fr}.opts.three{grid-template-columns:repeat(3,1fr)}.opts.five{grid-template-columns:repeat(5,1fr)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.ob-opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 12px;font-weight:700;font-size:16px;cursor:pointer;text-align:left;color:var(--fg)}
.ob-opt.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.ob-opt small{display:block;font-weight:400;font-size:13.5px;opacity:.85;margin-top:3px;line-height:1.35}
.obwarn{background:rgba(217,138,0,.14);border:1.5px solid #d98a00;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14.5px;line-height:1.45}
.obok{background:var(--soft);color:var(--softfg);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14.5px;font-weight:600}
.bodybox{background:var(--studio);border-radius:14px;padding:8px;margin:8px 0}
.bodybox svg{width:100%;display:block;max-height:340px}
.bodybox.photo{padding:0;overflow:hidden}
.bodybox.photo svg{max-height:none}
.bodybox.photo text{font:700 30px var(--body);fill:#5d6570}
.bodybox.photo .mz{display:none;opacity:1}
.bodybox.photo .mz.on{display:inline;animation:mzin .4s ease both}
@keyframes mzin{from{opacity:0}to{opacity:1}}
.mzf{fill:#2f7bff;fill-opacity:.5;stroke:#a9ccff;stroke-width:1.6;stroke-opacity:.95;stroke-linejoin:round}
.mzl{fill:none;stroke:#cfe3ff;stroke-width:1.3;stroke-opacity:.8;stroke-linecap:round}
.bodybox text{font:600 7px var(--body);fill:#5d6570}
.bk-sk{fill:url(#skinG);stroke:var(--skinedge);stroke-width:.9;paint-order:stroke;stroke-linejoin:round}
.bk-sh2{fill:#2b2f37;stroke:#0d0f13;stroke-width:.9;paint-order:stroke}
.bk-cl{fill:#22262e;stroke:#0b0d11;stroke-width:.9}
.bk-sh{fill:#15181d;stroke:#07080a;stroke-width:.9;paint-order:stroke;stroke-linejoin:round}
.bk-hr{fill:var(--hair)}
.bk-eye{fill:#2a1d16}
.mz{fill:var(--hot);opacity:0;transition:opacity .25s}
.mz.on{opacity:.82}
/* Zeit-Auswahl wie beim Wecker */
.wheel{position:relative;height:176px;margin:8px auto;max-width:280px}
.wheel::before{content:'';position:absolute;left:0;right:0;top:66px;height:44px;border-radius:12px;background:var(--surface2)}
.wheel::after{content:'Minuten';position:absolute;left:calc(50% + 28px);top:66px;line-height:44px;font-weight:700;font-size:16px;pointer-events:none}
.wheel-s{position:relative;z-index:1;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 72%,transparent)}
.wheel-s::-webkit-scrollbar{display:none}
.wheel-p{height:66px}
.wheel-i{height:44px;display:flex;align-items:center;justify-content:flex-end;padding-right:calc(50% - 20px);scroll-snap-align:center;font:800 italic 30px var(--display);color:var(--muted);cursor:pointer}
.wheel-i.sel{color:var(--fg)}
/* Fokus-Kasten */
.focus{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin:14px 0}
.focus strong{display:block;font-size:15px}
.focus p{margin:4px 0 0;color:var(--muted);font-size:14.5px;line-height:1.45}
/* Player */
.stage{position:relative;background:var(--studio);border-radius:26px;height:min(50vh,460px);min-height:330px;overflow:hidden;margin:6px 0 10px;padding:58px 10px 118px}
.stage .fig{width:100%;height:100%;aspect-ratio:auto;background:none}
.circ{position:absolute;top:12px;width:46px;height:46px;border-radius:50%;background:rgba(58,64,76,.6);color:#fff;display:grid;place-items:center;border:0;text-decoration:none}
.circ.r{right:12px}
.setp{position:absolute;top:18px;left:16px;background:rgba(58,64,76,.6);color:#fff;font-size:13.5px;font-weight:700;padding:6px 12px;border-radius:99px}
.ov{position:absolute;left:20px;bottom:12px;right:20px;color:#10131a}
.ov .reps{font:800 italic 58px/1 var(--display)}
.ov .reps small{font:600 22px var(--body)}
.ov .nm{font:600 21px/1.2 var(--body);margin:2px 0 0}

.stick{position:sticky;bottom:0;padding:14px 0 4px;background:linear-gradient(to bottom,transparent,var(--bg) 38%)}
#player{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.pl{max-width:560px;margin:0 auto;padding:14px 16px 24px;min-height:100%;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ph button{border:0;background:var(--surface2);width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer;flex:none}
.ph div{flex:1}
.ph strong{display:block;font:800 italic 22px/1 var(--display);text-transform:uppercase}
.ph span{color:var(--muted);font-size:13.5px}
.segs{display:flex;gap:5px;margin-bottom:14px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.segs b{display:block;height:100%;background:var(--accent)}
.pname{font:800 italic 34px/1 var(--display);text-transform:uppercase;margin:4px 0 2px}
.pill{display:flex;gap:6px;margin:12px 0 2px}
.pill i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.pill i.done{background:var(--fg)}
.pill i.cur{background:var(--accent)}
.target{text-align:center;margin:8px 0 2px}
.target .big{font:800 italic 92px/1 var(--display)}
.target .u{font:700 22px var(--display);color:var(--muted);text-transform:uppercase}
.cues{margin:12px 0 0;padding:0;list-style:none;color:var(--muted);font-size:15px}
.cues li{padding:5px 0 5px 16px;position:relative}
.cues li::before{content:'';position:absolute;left:0;top:14px;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.spacer{flex:1;min-height:8px}
.pbtns{display:flex;gap:10px;margin-top:14px}
.pbtns .btn{margin-top:0}
.rest{text-align:center;padding-top:6px}
.rest .lbl2{font:700 22px var(--display);color:var(--muted);text-transform:uppercase}
.rest .big{font:800 italic 128px/1 var(--display);color:var(--accent)}
.next{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.next .mini{width:112px}
.next span{color:var(--muted);font-size:14px}
.next strong{display:block;line-height:1.2}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px;z-index:40}

.dlg h3{font:800 italic 28px var(--display);text-transform:uppercase;margin:0 0 6px}
.done-h{font:800 italic 64px/.92 var(--display);text-transform:uppercase;margin:14px 0 6px}

const FOCUS={"pushup": ["Mittlere Brust", "Klassische Liegestütze belasten vor allem den großen Brustmuskel in seiner Mitte. Trizeps und vordere Schulter helfen mit, der Rumpf hält den Körper gerade."], "widepush": ["Brust, weiter Griff", "Der weite Griff dehnt den Brustmuskel stärker und verlagert die Arbeit von den Armen auf die Brust, der Trizeps arbeitet weniger mit. Man spricht oft von der „äußeren Brust“. Den Brustmuskel kann man nicht in Teilen einzeln trainieren, die Handbreite verschiebt aber die Belastung. Die Schultern werden stärker beansprucht, gehe deshalb nicht weiter als gezeigt."], "incline": ["Obere Brust", "Mit erhöhten Füßen drückst du dich schräg nach oben. Das verlagert die Belastung auf den oberen Teil des Brustmuskels und auf die vorderen Schultern. Der Trizeps hilft mit. Je höher die Füße, desto stärker der Effekt. Die untere Brust betonst du dagegen mit erhöhten Händen."], "pushhold": ["Brust und Schultern", "Im Halten unten arbeiten Brust, vordere Schulter und Trizeps gegen die Dehnung. Der Rumpf hält den Körper gerade. Das Halten trainiert Kraft genau in der Position, in der es am schwersten ist."], "dbpress": ["Mittlere Brust", "Die Bodenpresse trainiert den großen Brustmuskel und den Trizeps. Der Boden stoppt die Bewegung unten und schont dadurch die Schultern."], "bandpress": ["Brust", "Mit dem Band wird es oben am schwersten, kurz vor dem Strecken der Arme. Das fordert Brust und Trizeps, die vordere Schulter hilft mit."], "pike": ["Vordere Schulter", "Durch die hohe Hüfte drückst du dich fast senkrecht nach oben. Das belastet vor allem die vordere und mittlere Schulter, dazu den Trizeps. Die Brust ist hier nur Helfer."], "updown": ["Schultern und Trizeps", "Beim Wechsel zwischen Unterarm- und Handstütz arbeiten Trizeps und Schultern abwechselnd. Der Bauch stabilisiert dabei den Rumpf."], "dbohp": ["Schultern", "Das Drücken über Kopf belastet vor allem die vordere und seitliche Schulter. Der Trizeps streckt dabei den Arm mit."], "dbfront": ["Vordere Schulter", "Das Heben nach vorn trainiert die vordere Schulter fast einzeln. Obere Brust und Bizeps helfen ein wenig mit."], "facepull": ["Hintere Schulter und oberer Rücken", "Beim Ziehen zur Stirn arbeiten die hintere Schulter und die Muskeln zwischen den Schulterblättern. Das gleicht viele Drückübungen aus und hilft der Haltung."], "dips": ["Trizeps", "Beim Stuhl-Dip arbeitet vor allem der Trizeps. Die vordere Schulter hilft stark mit, die untere Brust ein wenig. Je tiefer du gehst, desto mehr Last liegt auf der Schulter, deshalb nur bis etwa 90 Grad."], "diamond": ["Trizeps und innere Brust", "Die enge Handstellung verlagert die Arbeit auf den Trizeps. Dazu kommt der innere Teil der Brust. Mit der unteren Brust haben Diamant-Liegestütze wenig zu tun. Die untere Brust betonst du eher mit erhöhten Händen, zum Beispiel mit den Händen auf einem Stuhl."], "skull": ["Trizeps", "Die Unterarme strecken sich bei festen Oberarmen. Das trainiert alle drei Köpfe des Trizeps, besonders den langen Kopf."], "superman": ["Unterer Rücken und Po", "Beim Superman arbeiten die Rückenstrecker entlang der Wirbelsäule und der Po. Dazu kommt die hintere Schulter."], "snow": ["Oberer Rücken und hintere Schulter", "Die Arme im Bogen zu führen fordert die Muskeln zwischen den Schulterblättern, den unteren Teil des Kapuzenmuskels und die hintere Schulter."], "row": ["Mittlerer Rücken", "Beim Rudern arbeiten der breite Rückenmuskel und die Muskeln zwischen den Schulterblättern. Der Bizeps hilft beim Ziehen mit."], "pullup": ["Breiter Rückenmuskel", "Beim Klimmzug im Obergriff arbeitet vor allem der breite Rückenmuskel. Bizeps und Unterarme helfen mit, der Rumpf hält den Körper ruhig."], "chinup": ["Rücken und Bizeps", "Der Untergriff bezieht den Bizeps stärker ein als der Obergriff. Der breite Rückenmuskel arbeitet trotzdem mit."], "dbrow": ["Mittlerer Rücken", "Das vorgebeugte Rudern trainiert den mittleren Rücken und den breiten Rückenmuskel. Der Bizeps hilft mit, der untere Rücken hält die Haltung."], "bandrow": ["Mittlerer Rücken", "Das Band wird beim Zurückziehen schwerer. Das trainiert den mittleren Rücken und die Muskeln zwischen den Schulterblättern, der Bizeps hilft mit."], "curl": ["Bizeps", "Der Bizeps beugt den Ellbogen. Beim Handtuch-Curl arbeitet er gegen den Druck deines Fußes. Der Unterarm hält mit."], "dbcurl": ["Bizeps", "Der Bizeps beugt den Ellbogen. Auch der tiefer liegende Armbeuger und der Unterarm arbeiten mit."], "bandcurl": ["Bizeps", "Das Band wird nach oben schwerer, der Bizeps arbeitet also am Ende der Bewegung am stärksten. Der Unterarm hilft mit."], "plank": ["Bauch und Rumpf", "Der gerade und die schrägen Bauchmuskeln und die tiefen Rumpfmuskeln halten den Körper gerade. Schultern und Po arbeiten mit."], "deadbug": ["Tiefer Bauch", "Der Dead Bug trainiert die tiefen Bauchmuskeln, die den unteren Rücken stabil halten, während sich Arme und Beine bewegen."], "legraise": ["Unterer Bauch", "Beim Beinheben arbeitet der gerade Bauchmuskel, wobei der untere Teil oft stärker gefordert ist. Der Hüftbeuger hilft mit. Der Rücken bleibt am Boden."], "crunch": ["Oberer Bauch", "Das Einrollen des Oberkörpers trainiert den geraden Bauchmuskel, vor allem seinen oberen Teil."], "mountain": ["Bauch und Schultern", "Im Liegestütz bleiben Rumpf und Schultern angespannt, während die Beine wechseln. Bauch und Hüftbeuger arbeiten dynamisch, das treibt zugleich den Puls hoch."], "hollow": ["Gerader Bauchmuskel", "Im Hollow Hold hält der gerade Bauchmuskel den unteren Rücken am Boden, dazu arbeiten die Hüftbeuger. Je tiefer die Beine, desto schwerer."], "hangleg": ["Unterer Bauch und Hüftbeuger", "Beim Beinheben im Hang arbeiten der gerade Bauchmuskel und die Hüftbeuger. Die Griffkraft und der Rücken halten mit."], "squat": ["Oberschenkel vorn und Po", "Die Kniebeuge trainiert den vorderen Oberschenkel und den Po. Je tiefer du gehst, desto mehr arbeitet der Po."], "tsquat": ["Oberschenkel vorn und Po", "Das langsame Absenken verlängert die Zeit, in der der vordere Oberschenkel und der Po unter Spannung stehen."], "jumpsq": ["Oberschenkel, Po und Waden", "Beim Sprung arbeiten Oberschenkel, Po und Waden explosiv. Die Übung trainiert Schnellkraft und treibt den Puls hoch."], "goblet": ["Oberschenkel vorn", "Das Gewicht vor der Brust hält den Oberkörper aufrecht, das betont den vorderen Oberschenkel. Po und Rumpf arbeiten mit."], "lunge": ["Oberschenkel vorn und Po", "Beim Ausfallschritt rückwärts arbeitet das vordere Bein: vorderer Oberschenkel und Po. Rückwärts gilt als kniefreundlicher als vorwärts."], "bulgarian": ["Oberschenkel vorn und Po, einbeinig", "Ein Bein trägt fast die ganze Last. Das fordert vorderen Oberschenkel, Po und das Gleichgewicht. Aufrechter Oberkörper betont den Oberschenkel, mehr Vorbeuge den Po."], "wallsit": ["Oberschenkel vorn", "Im Wandsitz hält der vordere Oberschenkel dein Gewicht statisch. Das trainiert Kraftausdauer."], "bridge": ["Po", "Die Hüftstreckung trainiert den großen Gesäßmuskel. Die hinteren Oberschenkel helfen mit. Einbeinig wird es deutlich schwerer."], "rdl": ["Hintere Oberschenkel und Po", "Beim Kreuzheben auf einem Bein werden die hinteren Oberschenkel und der Po gedehnt und gekräftigt. Der untere Rücken hält die Haltung, das Gleichgewicht wird mittrainiert."], "dbrdl": ["Hintere Oberschenkel und Po", "Beim Rumänischen Kreuzheben dehnen und kräftigen sich die hinteren Oberschenkel und der Po. Der untere Rücken hält die gerade Haltung."], "kbswing": ["Po und hintere Oberschenkel", "Die Kraft kommt aus der Hüfte, nicht aus den Armen. Po und hintere Oberschenkel arbeiten explosiv, Rücken und Schultern halten mit."], "towelcurl": ["Hintere Oberschenkel", "Beim Heranziehen der Fersen beugen sich die Knie. Das trainiert die hinteren Oberschenkel, der Po hält die Hüfte oben."], "calf": ["Waden", "Das Heben auf die Zehen trainiert den Wadenmuskel. Einbeinig wird es deutlich schwerer."], "calf2": ["Waden", "Das langsame Absenken lässt den Wadenmuskel länger unter Spannung arbeiten. Oben kurz halten verstärkt den Reiz."], "dbcalf": ["Waden", "Die Hanteln erhöhen die Last für den Wadenmuskel. So bleibt der Reiz auch für kräftige Waden hoch."]};

function capD(p,q,r1,r2){const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy);if(l<.01)return dotD(p,Math.max(r1,r2));

function region(m,J,s,fr){

  case 'Bauch':return capD(off(at(N,P,.52),4.5),off(at(N,P,.95),4.5),5.6*s,5.6*s);

function prof(arr,t){for(let i=1;i<arr.length;i++){if(t<=arr[i][0]){const a=arr[i-1],b=arr[i],k=(t-a[0])/(b[0]-a[0]);return [a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]}}const l=arr[arr.length-1];return [l[1],l[2]]}
function cr(P){let s='';for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];

function limbD(p,q,arr,side,s,t0,t1,grow){
 t0=t0||0;t1=(t1===undefined)?1:t1;grow=grow||0;
 const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;

  plus.push([c[0]+nx*rp,c[1]+ny*rp]);minus.push([c[0]-nx*rm,c[1]-ny*rm])}
 const e=plus[N],f=minus[N],g=minus[0],h=plus[0];
 const rE=Math.hypot(e[0]-f[0],e[1]-f[1])/2,rS=Math.hypot(g[0]-h[0],g[1]-h[1])/2;
 return `M${F1(h[0])} ${F1(h[1])}${cr(plus)}A${F1(rE)} ${F1(rE)} 0 0 0 ${F1(f[0])} ${F1(f[1])}${cr(minus.slice().reverse())}A${F1(rS)} ${F1(rS)} 0 0 0 ${F1(h[0])} ${F1(h[1])}Z`}
function headParts(H,N,fr,s){
 let ux=H[0]-N[0],uy=H[1]-N[1];const ul=Math.hypot(ux,uy)||1;ux/=ul;uy/=ul;

 if(fl<.2){fx=uy;fy=-ux}else{fx/=fl;fy/=fl}

function layers(e,t){

function ensureKF(n){if(KFDONE[n])return;KFDONE[n]=1;const st=1/n,f=st*.55;let css='';
 for(let i=1;i<=n;i++){const a=((i*st-f)*100).toFixed(2),b=(i*st*100).toFixed(2);css+=`@keyframes pk${n}_${i}{0%{opacity:0}${a}%{opacity:0}${b}%{opacity:1}100%{opacity:1}}`}
 const el=document.createElement('style');el.textContent=css;document.head.appendChild(el)}
let FIGS=[];
const IO=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(en=>{const f=en.target._f;if(f)f.vis=en.isIntersecting}),{rootMargin:'120px'}):null;
function hydrate(root){root.querySelectorAll('svg.fig:not([data-h])').forEach(svg=>{svg.dataset.h=1;
 const els=[];svg.querySelectorAll('[data-i]').forEach(el=>els[+el.dataset.i]=el);
 const f={svg,e:EX[svg.dataset.ex],els,t0:performance.now(),vis:!IO,still:false,fixed:svg.dataset.still==='1'};svg._f=f;FIGS.push(f);
 if(IO)IO.observe(svg);draw(f,0)})}
function draw(f,t){layers(f.e,t).forEach(([c,d],i)=>{if(f.els[i])f.els[i].setAttribute('d',d)})}
const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let lastT=0;
function frame(now){
 requestAnimationFrame(frame);
 if(now-lastT<32)return;lastT=now;
 FIGS=FIGS.filter(f=>{if(f.svg.isConnected)return true;if(IO)IO.unobserve(f.svg);return false});
 for(const f of FIGS){const e=f.e;if(!f.vis||f.fixed)continue;
  if(e.t==='h'||REDUCED){if(!f.still){draw(f,0);f.still=true}continue}
  const ph=((now-f.t0)/1000)/(e.per||3.4)*Math.PI*2;
  draw(f,.5-.5*Math.max(-1,Math.min(1,Math.cos(ph)*1.5)))}}
requestAnimationFrame(frame);

const GOALS={
 muskel:{n:'Muskelaufbau',sets:8,txt:'Mehr Muskelmasse und Form. Dafür brauchst du genug Training: etwa 8 harte Sätze pro Muskel und Woche.'},
 kraft:{n:'Kraft',sets:6,txt:'Stärker werden. Etwa 6 Sätze pro Muskel und Woche reichen für guten Fortschritt.'},
 fit:{n:'Fit und gesund',sets:3,txt:'Belastbar und beweglich bleiben. Schon etwa 3 Sätze pro Muskel und Woche halten dich in Form.'},
 straff:{n:'Straffen und Körperfett senken',sets:5,txt:'Muskeln formen und erhalten. Körperfett sinkt vor allem über die Ernährung, Krafttraining erhält dabei deine Muskeln.'}
};
const exN=m=>Math.round(m/3);
const MINOPTS=[15,20,25,30,35,40,45,50,55,60];
const SHORT={'Po & Beinbeuger':'Po','Quadrizeps':'Oberschenkel'};
const MLAB={'Quadrizeps':'Oberschenkel vorn','Po & Beinbeuger':'Po & Oberschenkel hinten'};
const PRIO=['Brust','Rücken','Quadrizeps','Po & Beinbeuger','Schultern','Bizeps','Trizeps','Bauch','Waden'];
const PATTERN={1:[0],2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]};

/* --- Prüfung: passen Ziel, Zeit, Einheiten und Muskeln zusammen? --- */
function checkPlan(p){
 const msgs=[],n=exN(p.minutes),D=p.days,M=p.muscles.length,g=GOALS[p.goal||'muskel'];
 if(!M)return {msgs:[{x:'Wähle mindestens eine Muskelgruppe.'}],f:1,avail:0,need:0,per:0,ok:false};
 let f=p.freq;
 if(f>D){msgs.push({x:`Du willst jeden Muskel ${f}× pro Woche trainieren, hast aber nur ${D} Einheiten. Mehr als ${D}× pro Woche geht nicht, ich plane mit ${D}×.`});f=D}
 const per=Math.max(g.sets,f*3),need=M*per,avail=D*n*3;
 if(avail<need){
  const minDays=Math.ceil(need/(n*3));
  const exNeeded=Math.ceil(Math.ceil(need/D)/3);
  const minMin=MINOPTS.find(m=>exN(m)>=exNeeded);
  const maxM=Math.floor(avail/per);
  const opts=[];
  if(minDays<=6&&minDays>D)opts.push(`mindestens ${minDays} Einheiten pro Woche`);
  if(minMin&&minMin>p.minutes)opts.push(`${minMin} Minuten pro Einheit bei ${D} Einheiten`);
  if(maxM>=1)opts.push(`höchstens ${maxM} Muskelgruppe${maxM>1?'n':''} bei ${D} Einheiten à ${p.minutes} Minuten`);
  msgs.push({x:`Das passt nicht zusammen: Mit ${D} Einheiten à ${p.minutes} Minuten schaffst du etwa ${avail} Sätze pro Woche. Für „${g.n}“ an ${M} Muskelgruppe${M>1?'n':''} brauchst du etwa ${need} (${per} pro Muskel). ${opts.length?'Das würde passen: '+opts.join(', oder ')+'.':'Wähle weniger Muskelgruppen oder mehr Zeit.'}`})
 }
 return {msgs,f,per,need,avail,ok:msgs.length===0}}
function warnHTML(c){
 if(c.msgs.length)return `<div class="obwarn"><strong>Hinweis</strong><br>${c.msgs.map(m=>m.x).join('<br><br>')}</div>`;
 return `<div class="obok">Das passt zusammen: etwa ${c.avail} Sätze pro Woche, für dein Ziel werden etwa ${c.need} gebraucht.</div>`}

/* --- Automatischer Wochenplan --- */
function buildPlan(p,level,gear){
 const D=p.days,n=exN(p.minutes),f=Math.min(p.freq,D);
 const ms=PRIO.filter(m=>p.muscles.includes(m));
 const load=Array(D).fill(0),sess=Array.from({length:D},()=>[]);
 const combos=(arr,k)=>k===0?[[]]:arr.flatMap((x,i)=>combos(arr.slice(i+1),k-1).map(c=>[x].concat(c)));
 const C=combos([...Array(D).keys()],f);
 ms.forEach(m=>{let best=null;
  C.forEach(c=>{let cost=c.reduce((a,s)=>a+load[s],0)*3;
   for(let i=1;i<c.length;i++)if(c[i]-c[i-1]===1)cost+=(f<=D/2?8:2);
   if(!best||cost<best.cost)best={cost,c}});
  best.c.forEach(s=>{sess[s].push(m);load[s]++})});
 const target=LT[level],used={};
 const has=id=>EX[id].g.every(g=>gear[g]);
 const pick=(m,k,chosen)=>{
  let cand=Object.keys(EX).filter(id=>EX[id].p[0]===m&&has(id)&&!chosen.includes(id));
  if(cand.length<k)cand=cand.concat(Object.keys(EX).filter(id=>EX[id].p.includes(m)&&EX[id].p[0]!==m&&has(id)&&!chosen.includes(id)));
  const near=cand.filter(id=>Math.abs(EX[id].d-target)<=1.6);
  if(near.length>=k)cand=near;
  cand.sort((a,b)=>((used[a]||0)-(used[b]||0))||(Math.abs(EX[a].d-target)-Math.abs(EX[b].d-target)));
  const out=cand.slice(0,k);out.forEach(id=>{used[id]=(used[id]||0)+1});return out};
 const out=[];
 sess.forEach(mm=>{
  if(!mm.length)return;
  const slots=mm.map(()=>0);let left=n;
  mm.forEach((m,i)=>{if(left>0){slots[i]=1;left--}});
  let go=true;while(left>0&&go){go=false;mm.forEach((m,i)=>{if(left>0&&slots[i]<3){slots[i]++;left--;go=true}})}
  const chosen=[],byM={};
  mm.forEach((m,i)=>{byM[m]=pick(m,slots[i],chosen);chosen.push(...byM[m])});
  let total=chosen.length,guard=0;
  while(total<n&&guard<20){guard++;let added=false;
   for(const m of mm){if(total>=n)break;if((byM[m]||[]).length>=3)continue;const x=pick(m,1,chosen);if(x.length){byM[m].push(x[0]);chosen.push(x[0]);total++;added=true}}
   if(!added)break}
  const exs=[];mm.forEach(m=>exs.push(...(byM[m]||[])));
  if(!exs.length)return;
  const t=mm.slice(0,2).map(x=>SHORT[x]||x).join(' & ')+(mm.length>2?' +'+(mm.length-2):'');
  out.push({t,ex:exs,mu:mm});
 });
 return {W:out,dropped:D-out.length,f};
}

function obPaintBody(){
 document.querySelectorAll('#ob .mz').forEach(el=>el.classList.toggle('on',OB.muscles.includes(el.dataset.m)));

/* --- Fragen --- */
function obDefaults(){const p=(S.profile&&!S.profile.skipped)?S.profile:{};
 return {step:0,sex:p.sex||null,age:p.age||'',goal:p.goal||null,level:S.level,gear:Object.assign({},S.gear),days:p.days||5,minutes:Math.max(15,p.minutes||15),muscles:(p.muscles&&p.muscles.length)?p.muscles.slice():CATS.slice(),freq:p.freq||2}}
function obOpen(){OB=obDefaults();obRender()}
function obClose(){OB=null;const el=$('#ob');el.hidden=true;el.innerHTML=''}
const obParams=()=>({goal:OB.goal||'muskel',days:OB.days,minutes:OB.minutes,muscles:OB.muscles,freq:OB.freq});
function ageHint(){const a=parseInt(OB.age,10);if(isNaN(a))return '';
 if(a<12||a>99)return '<p class="warn">Bitte ein Alter zwischen 12 und 99 eingeben.</p>';
 if(a<16)return '<div class="obwarn">Unter 16 Jahren sprich vor dem Training bitte mit deinen Eltern oder einem Arzt. Starte mit dem Level „Neustart“.</div>';
 if(a>=60)return '<div class="obwarn">Starte ruhig mit dem Level „Neustart“ und steigere dich langsam. Bei Vorerkrankungen vorher ärztlich abklären.</div>';
 return ''}
const obOpt=(on,act,attrs,label,small)=>`<button class="ob-opt ${on?'on':''}" data-act="${act}" ${attrs}>${label}${small?`<small>${small}</small>`:''}</button>`;
const obNav=(back,act,label)=>`<div class="stick"><div class="pbtns">${back?'<button class="btn ghost" data-act="ob-back">Zurück</button>':''}<button class="btn" data-act="${act||'ob-next'}">${label||'Weiter'}</button></div></div>`;
const obSetsText=()=>`${OB.days} Einheiten à ${OB.minutes} Minuten, etwa ${OB.days*exN(OB.minutes)*3} Sätze pro Woche.`;
function obWheelSet(m,smooth){const w=$('#wheel');if(!w)return;const idx=MINOPTS.indexOf(m);if(idx<0)return;
 if(smooth&&w.scrollTo)w.scrollTo({top:idx*44,behavior:'smooth'});else w.scrollTop=idx*44}
document.addEventListener('scroll',e=>{const w=e.target;if(!OB||!w||w.id!=='wheel')return;
 const idx=Math.max(0,Math.min(MINOPTS.length-1,Math.round(w.scrollTop/44)));
 const m=MINOPTS[idx];if(m!==OB.minutes){OB.minutes=m;
  w.querySelectorAll('.wheel-i').forEach((el,i)=>el.classList.toggle('sel',i===idx));
  const t=$('#obsets');if(t)t.textContent=obSetsText()}},true);
function obRender(){
 if(!OB)return;const el=$('#ob');el.hidden=false;const y=el.scrollTop,st=OB.step;
 const prog=`<div class="obp">${Array.from({length:7},(_,i)=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
 let b='';
 if(st===0){
  b=`<div class="brand">Feierabend<i>Fit</i></div><h1 class="obh" style="margin-top:14px">Dein Plan</h1><p class="sub">Ich stelle dir ein paar Fragen und baue dann deinen Wochenplan.</p>
   <div class="lbl">Ich bin</div><div class="opts two">${obOpt(OB.sex==='m','ob-set','data-k="sex" data-v="m"','Mann')}${obOpt(OB.sex==='f','ob-set','data-k="sex" data-v="f"','Frau')}</div>
   <div class="lbl">Alter</div><input id="obAge" class="search" type="number" inputmode="numeric" min="12" max="99" placeholder="Alter in Jahren" value="${OB.age}"><div id="obAgeHint">${ageHint()}</div>
   <p class="sub">Die App ersetzt keine ärztliche Beratung. Bei Vorerkrankungen oder Schmerzen sprich vorher mit einer Ärztin oder einem Arzt.</p>
   <div class="spacer"></div>${(S.profile&&S.profile.done)?'<button class="btn ghost" data-act="ob-close">Abbrechen</button>':'<button class="btn ghost" data-act="ob-skip">Überspringen: Standardplan nutzen</button>'}${obNav(false)}`}
 else if(st===1){
  b=`<h1 class="obh">Dein Ziel</h1><p class="sub">Wähle, was dir am wichtigsten ist.</p><div class="opts">${Object.keys(GOALS).map(k=>obOpt(OB.goal===k,'ob-set',`data-k="goal" data-v="${k}"`,GOALS[k].n,GOALS[k].txt)).join('')}</div><div class="spacer"></div>${obNav(true)}`}
 else if(st===2){
  b=`<h1 class="obh">Dein Level</h1><p class="sub">Wähle ehrlich. Das Level passt sich später an: Im Reiter „Fortschritt“ gibt es einen Level-Test, und nach jedem Training sagst du, ob es zu leicht oder zu schwer war.</p><div class="opts">${LEVELS.map((l,i)=>obOpt(OB.level===i,'ob-set',`data-k="level" data-v="${i}"`,l.n,l.txt)).join('')}</div><div class="spacer"></div>${obNav(true)}`}
 else if(st===3){
  b=`<h1 class="obh">Deine Geräte</h1><p class="sub">Ohne Geräte geht immer. Mit mehr Geräten gibt es mehr Übungen.</p><div class="opts">${GEAR.map(([k,l])=>obOpt(OB.gear[k],'ob-gear',`data-g="${k}"`,(OB.gear[k]?'✓ ':'')+l)).join('')}</div><div class="spacer"></div>${obNav(true)}`}
 else if(st===4){
  b=`<h1 class="obh">Deine Zeit</h1><div class="lbl">Trainingseinheiten pro Woche</div><div class="opts five">${[2,3,4,5,6].map(d=>obOpt(OB.days===d,'ob-set',`data-k="days" data-v="${d}"`,d)).join('')}</div>
   <div class="lbl">Dauer pro Einheit, nach oben oder unten wischen</div>
   <div class="wheel"><div class="wheel-s" id="wheel" role="listbox" aria-label="Minuten pro Einheit"><div class="wheel-p"></div>${MINOPTS.map(m=>`<div class="wheel-i ${OB.minutes===m?'sel':''}" role="option" data-act="ob-min" data-v="${m}">${m}</div>`).join('')}<div class="wheel-p"></div></div></div>
   <p class="sub" id="obsets" style="text-align:center">${obSetsText()}</p><div class="spacer"></div>${obNav(true)}`}
 else if(st===5){
  b=`<h1 class="obh">Zielmuskeln</h1><p class="sub">Tippe auf die Muskelgruppen, die du trainieren willst. Sie leuchten blau.</p>${bodyHTML()}
   <div class="mgrid">${CATS.map(m=>`<button class="ob-opt" data-act="ob-m" data-m="${m}">${MLAB[m]||m}</button>`).join('')}</div>
   <div class="opts two"><button class="ob-opt" data-act="ob-all">Alle</button><button class="ob-opt" data-act="ob-none">Keine</button></div>
   <div class="lbl">Wie oft pro Woche soll jeder gewählte Muskel drankommen?</div><div class="opts three">${[1,2,3].map(f=>obOpt(OB.freq===f,'ob-set',`data-k="freq" data-v="${f}"`,f+'×')).join('')}</div>
   <div id="obwarn">${warnHTML(checkPlan(obParams()))}</div><div class="spacer"></div>${obNav(true)}`}
 else{
  const P=buildPlan(obParams(),OB.level,OB.gear),chk=checkPlan(obParams()),pat=PATTERN[Math.min(6,Math.max(1,P.W.length))]||[];
  const short=OB.muscles.filter(m=>P.W.filter(w=>w.ex.some(id=>EX[id].p.includes(m))).length<chk.f);
  const avgMin=P.W.length?P.W.reduce((a,w)=>a+w.ex.length*3,0)/P.W.length:0;
  const few=OB.muscles.filter(m=>Object.keys(EX).filter(id=>EX[id].p.includes(m)&&EX[id].g.every(g=>OB.gear[g])).length<2);
  b=`<h1 class="obh">Dein Plan</h1><div class="card"><strong>${GOALS[OB.goal||'muskel'].n}</strong><p class="sub" style="margin:4px 0 0">Level ${LEVELS[OB.level].n}, ${P.W.length} Einheiten pro Woche, jeder gewählte Muskel ${chk.f}× pro Woche.</p></div>
   ${warnHTML(chk)}${P.dropped>0?`<div class="obwarn">Für deine Auswahl reichen ${P.W.length} statt ${OB.days} Einheiten.</div>`:''}${short.length?`<div class="obwarn">Diese Muskeln kommen seltener als gewünscht dran: ${short.map(m=>MLAB[m]||m).join(', ')}.</div>`:''}${(P.W.length&&avgMin<OB.minutes-4)?`<div class="obwarn">Deine Einheiten dauern nur etwa ${Math.round(avgMin)} statt ${OB.minutes} Minuten, weil für die gewählten Muskeln nicht mehr Übungen nötig sind (höchstens 3 pro Muskel und Einheit). Wähle mehr Muskelgruppen oder eine kürzere Dauer.</div>`:''}${few.length?`<div class="obwarn">Für ${few.map(m=>MLAB[m]||m).join(', ')} gibt es mit deinen Geräten nur eine Übung. Mit Kurzhanteln, Band oder Klimmzugstange kommen mehr dazu, du kannst sie im Schritt „Geräte“ einschalten.</div>`:''}
   ${P.W.map((w,k)=>`<div class="card"><div class="row"><div><strong>${DAYS_LONG[pat[k]]}: ${w.t}</strong><div class="sub" style="margin:2px 0 0">${w.mu.map(m=>MLAB[m]||m).join(', ')}</div></div><span class="chip">${w.ex.length*3} Min</span></div></div>`).join('')}
   <div class="spacer"></div>${obNav(true,'ob-finish',chk.ok?'Plan starten':'Trotzdem starten')}`}
 el.innerHTML=`<div class="obw">${prog}${b}</div>`;el.scrollTop=y;
 if(st===5)obPaintBody();
 if(st===4)obWheelSet(OB.minutes,false)}
function obNext(){const st=OB.step;
 if(st===0){const a=parseInt(OB.age,10);if(!OB.sex){toast('Bitte Mann oder Frau auswählen');return}if(isNaN(a)||a<12||a>99){toast('Bitte ein Alter zwischen 12 und 99 eingeben');return}}
 if(st===1&&!OB.goal){toast('Bitte ein Ziel auswählen');return}
 if(st===5&&!OB.muscles.length){toast('Wähle mindestens eine Muskelgruppe');return}
 if(OB.step<6)OB.step++;obRender();$('#ob').scrollTop=0}
function obBack(){if(OB.step>0){OB.step--;obRender();$('#ob').scrollTop=0}}
function obFinish(){
 const P=buildPlan(obParams(),OB.level,OB.gear);
 if(!P.W.length){toast('Mit dieser Auswahl ist kein Plan möglich. Prüfe Muskeln und Geräte.');return}
 const chk=checkPlan(obParams());
 S.profile={done:true,sex:OB.sex,age:OB.age,goal:OB.goal||'muskel',days:OB.days,minutes:OB.minutes,muscles:OB.muscles.slice(),freq:chk.f};
 S.level=OB.level;S.lvlFrom=S.log.length;S.gear=Object.assign({},OB.gear);
 S.planW=P.W;W=S.planW;S.custom={};
 S.days=[0,0,0,0,0,0,0];(PATTERN[Math.min(6,Math.max(1,W.length))]||[]).forEach(i=>{S.days[i]=1});
 save();obClose();TAB='heute';render();window.scrollTo(0,0);toast('Plan erstellt')}
function obSkip(){S.profile={done:true,skipped:true,goal:'muskel',days:5,minutes:15,muscles:CATS.slice(),freq:2};save();obClose();render()}
function profSummary(){const p=S.profile;if(!p||!p.goal)return 'Standardplan: 5 Einheiten, alle Muskelgruppen 2× pro Woche.';
 return `${GOALS[p.goal].n}, ${W.length} Einheiten pro Woche, ${p.minutes} Minuten, ${p.muscles.length} Muskelgruppen ${p.freq}× pro Woche.`}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,d=el.dataset;
 switch(a){
  case 'tab':TAB=d.t;RESET=false;if(TAB!=='ueb')SWAP=null;render();window.scrollTo(0,0);break;
  case 'start':startWorkout(+d.w);break;
  case 'level':setLevel(+d.v);render();break;
  case 'lvl-apply':setLevel(S.level+(+d.v));toast('Level angepasst');render();break;
  case 'test-open':TEST=(TEST&&TEST.open)?null:{open:true};render();break;
  case 'test-run':{const v=id=>parseInt(($(id)||{}).value,10);const p=v('#t1'),q=v('#t2'),r=v('#t3');
   if([p,q,r].some(x=>isNaN(x)||x<0)){toast('Bitte alle drei Werte eintragen');break}
   TEST={open:true,res:scoreTest(p,q,r),vals:[p,q,r]};render();break}
  case 'test-take':setLevel(TEST.res);TEST=null;toast('Level übernommen');render();break;
  case 'fb':{const l=S.log[S.log.length-1];if(l&&PL){l.r=d.v;save();PL.fb=d.v;renderPlayer()}break}
  case 'fit':COL.fit=!COL.fit;render();break;
  case 'theme':S.theme=d.v;save();applyTheme();render();break;
  case 'day':{const i=+d.i,n=S.days.filter(Boolean).length;
   if(!S.days[i]&&n>=W.length){toast('Maximal '+W.length+' Trainingstage');break}
   S.days[i]=S.days[i]?0:1;save();render();break}
  case 'sound':S.sound=S.sound?0:1;save();render();break;
  case 'reset':if(RESET){S.log=[];save();RESET=false;toast('Verlauf gelöscht')}else{RESET=true}render();break;
  case 'cat':COL.cat=d.c;render();break;
  case 'gear':S.gear[d.g]=S.gear[d.g]?0:1;save();render();break;
  case 'info':SHEET={id:d.id,step:'info'};renderSheet();break;
  case 'close-sheet':SHEET=null;renderSheet();break;
  case 'sheet-pick':SHEET.step='w';renderSheet();break;
  case 'sheet-back':SHEET.step='info';renderSheet();break;
  case 'pickw':SHEET.w=+d.w;SHEET.step='s';renderSheet();break;
  case 'pick-back':SHEET.step='w';renderSheet();break;
  case 'puts':{if(putEx(SHEET.w,+d.s,SHEET.id)){SHEET=null;renderSheet();render()}break}
  case 'swap':{const cur=EX[exList(+d.w)[+d.s]];SWAP={w:+d.w,s:+d.s,from:TAB};COL.cat=cur.p[0];COL.q='';TAB='ueb';render();window.scrollTo(0,0);break}
  case 'cancel-swap':TAB=SWAP.from||'plan';SWAP=null;render();break;
  case 'put':{if(SWAP&&putEx(SWAP.w,SWAP.s,d.id)){TAB=SWAP.from||'plan';SWAP=null;SHEET=null;renderSheet();render();window.scrollTo(0,0)}break}
  case 'restore':delete S.custom[+d.w];save();toast('Standard wiederhergestellt');render();break;
  case 'ob-open':obOpen();break;
  case 'ob-set':OB[d.k]=['level','days','minutes','freq'].includes(d.k)?+d.v:d.v;obRender();break;
  case 'ob-gear':OB.gear[d.g]=OB.gear[d.g]?0:1;obRender();break;
  case 'ob-m':{const i=OB.muscles.indexOf(d.m);if(i>=0)OB.muscles.splice(i,1);else OB.muscles.push(d.m);obPaintBody();$('#obwarn').innerHTML=warnHTML(checkPlan(obParams()));break}
  case 'ob-all':OB.muscles=CATS.slice();obPaintBody();$('#obwarn').innerHTML=warnHTML(checkPlan(obParams()));break;
  case 'ob-none':OB.muscles=[];obPaintBody();$('#obwarn').innerHTML=warnHTML(checkPlan(obParams()));break;
  case 'ob-min':OB.minutes=+d.v;obWheelSet(+d.v,true);{const t=$('#obsets');if(t)t.textContent=obSetsText()}break;
  case 'ob-next':obNext();break;
  case 'ob-back':obBack();break;
  case 'ob-finish':obFinish();break;
  case 'ob-skip':obSkip();break;
  case 'ob-close':obClose();break;
  case 'p-next':if(PL){if(PL.phase==='ready'||PL.phase==='rest')beginWork();else if(PL.phase==='work')finishSet()}break;
  case 'p-plus':if(PL&&PL.phase==='rest'){PL.end+=15000}break;
  case 'p-pause':if(PL){if(PL.paused){PL.end=Date.now()+PL.left;PL.paused=false}else{PL.left=PL.end-Date.now();PL.paused=true}renderPlayer()}break;
  case 'p-exit':if(PL){PL.confirm=true;renderPlayer()}break;
  case 'p-no':if(PL){PL.confirm=false;renderPlayer()}break;
  case 'p-yes':case 'p-close':closePlayer();break;
 }
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='q'){COL.q=e.target.value;const g=$('#grid');if(g){g.innerHTML=gridHTML();hydrate(g)}}});
render();
if(!S.profile||!S.profile.done)obOpen();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
