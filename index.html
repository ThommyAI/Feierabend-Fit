<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feierabend-Fit">
<title>Feierabend-Fit – 15 Minuten Muskelaufbau</title>
<link rel="stylesheet" href="fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f3f4f6;--surface:#ffffff;--surface2:#e6e9ee;--fg:#0a0a0a;--muted:#59616b;--line:#d6d9df;
  --accent:#0b5cff;--onaccent:#ffffff;--soft:#dbe7ff;--softfg:#0a3fae;--danger:#c4271c;
  --body1:#6a727d;--body2:#2b3138;--bodyfar:#a3abb6;--hot:#0b5cff;--gear:#8b939e;
  --studio:radial-gradient(ellipse at 50% 95%,#ffffff 0%,#eef1f6 55%,#dde2ec 100%);
  --skin1:#f0bf9b;--skin2:#c98d64;--skinfar:#a26f50;--skinedge:#7b4a33;--skinear:#c28a66;--shirt:#f2f4f7;--shorts:#1a2236;--hair:#2b1c14;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050607;--surface:#101217;--surface2:#1a1d24;--fg:#ffffff;--muted:#8d949e;--line:#252932;
    --accent:#2f7bff;--onaccent:#ffffff;--soft:#12264d;--softfg:#9cc1ff;--danger:#ff7b72;
    --body1:#f6f8fb;--body2:#aeb5c0;--bodyfar:#626a76;--hot:#2f7bff;--gear:#59616d;
  }
}
:root[data-theme="dark"]{
  --bg:#050607;--surface:#101217;--surface2:#1a1d24;--fg:#ffffff;--muted:#8d949e;--line:#252932;
  --accent:#2f7bff;--onaccent:#ffffff;--soft:#12264d;--softfg:#9cc1ff;--danger:#ff7b72;
  --body1:#f6f8fb;--body2:#aeb5c0;--bodyfar:#626a76;--hot:#2f7bff;--gear:#59616d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.brand{font:800 italic 28px/1 var(--display);letter-spacing:.01em;text-transform:uppercase}
.brand i{font-style:italic;color:var(--accent)}
.date{color:var(--muted);font-size:14px}
.h1{font:800 italic 46px/.92 var(--display);text-transform:uppercase;margin:0 0 8px}
.h2{font:800 italic 26px/1 var(--display);text-transform:uppercase;margin:24px 0 10px}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.hero{border-left:4px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.chip.p{background:var(--soft);color:var(--softfg)}
.meta{display:flex;gap:16px;color:var(--muted);font-size:14px;margin:8px 0 4px}
.meta b{color:var(--fg);font:800 italic 22px var(--display);margin-right:3px}
.btn{appearance:none;border:0;border-radius:10px;padding:16px 20px;font:800 17px var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--onaccent);width:100%;cursor:pointer;margin-top:12px;display:block;text-align:center;text-decoration:none}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.small{width:auto;padding:9px 14px;font-size:15px;margin-top:0;display:inline-block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.wd b{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font:800 italic 20px var(--display);background:var(--surface);border:1.5px solid var(--line);color:var(--fg)}
.wd.done b{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.wd.rest b{color:var(--muted);background:transparent;border-style:dashed}
.wd.today{color:var(--fg);font-weight:700}
.wd.today b{box-shadow:0 0 0 3px var(--soft);border-color:var(--accent)}
.exrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exrow:first-of-type{border-top:0}
.exrow .tx{flex:1;min-width:0}
.exrow strong{display:block;font-size:15px;line-height:1.25}
.exrow span{color:var(--muted);font-size:14px}
.swap{appearance:none;border:1.5px solid var(--line);background:none;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;flex:none}
.fig{width:100%;display:block}
.mini{width:104px;flex:none;background:var(--studio);border-radius:10px;aspect-ratio:16/10}
.figbox{background:var(--studio);border-radius:14px;padding:4px 6px}
.figbox .fig{aspect-ratio:16/10}
svg polyline,svg line,svg rect{fill:none;stroke-linecap:round;stroke-linejoin:round}
.floor{stroke:var(--bodyfar);stroke-width:1.5;opacity:.6}
.prop{stroke:#8a919c;stroke-width:3;fill:none}
.mat{fill:#3f434b;stroke:#2a2d33;stroke-width:1.5;stroke-linejoin:round}
.shd{fill:rgba(20,24,32,.13)}
.sk{fill:url(#skinG);stroke:var(--skinedge);stroke-width:2.2;paint-order:stroke;stroke-linejoin:round}
.sk.far{fill:var(--skinfar)}
.shirt{fill:#22262e;stroke:#0b0d11;stroke-width:1.8;paint-order:stroke;stroke-linejoin:round}
.shorts{fill:#15181d;stroke:#07080a;stroke-width:1.8;paint-order:stroke;stroke-linejoin:round}
.shorts.far{fill:#0e1014}
.shoe{fill:#2b2f37;stroke:#0d0f13;stroke-width:1.8;paint-order:stroke;stroke-linejoin:round}
.shoe.far{fill:#4a505b}
.sole{fill:none;stroke:#f4f6fa;stroke-width:2.4;stroke-linecap:round}
.hair{fill:var(--hair);stroke:none}
.ear{fill:var(--skinear);stroke:var(--skinedge);stroke-width:.8}
.eye{fill:#2a1d16;stroke:none}
.hot,.sec{fill:var(--hot);stroke:none}
.hot{opacity:.62;animation:glow 1.7s ease-in-out infinite}
.sec{opacity:.28}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:.82}}
.gh{fill:#5b636f;stroke:#eef1f6;stroke-width:1.6;paint-order:stroke}
.tw{stroke:var(--muted);stroke-width:2.2;stroke-dasharray:3 3;fill:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--fg)}
.nav button.on svg{stroke:var(--accent)}
details.plan{padding:0;overflow:hidden}
details.plan summary{list-style:none;display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
details.plan summary::-webkit-details-marker{display:none}
details.plan .body{padding:0 16px 16px}
.dn{font:800 italic 26px var(--display);width:38px;flex:none;color:var(--accent)}
details.plan summary div{flex:1}
details.plan summary strong{display:block;font-size:17px}
details.plan summary span{color:var(--muted);font-size:14px}
.ok{font-style:normal;background:var(--accent);color:var(--onaccent);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:14px}
.prow{display:flex;gap:14px;align-items:center;padding:12px 16px;border:1.5px dashed var(--line);border-radius:14px;margin-bottom:12px;color:var(--muted)}
.prow b{font:800 italic 26px var(--display);width:38px;flex:none}
.prow strong{display:block;color:var(--fg);font-size:16px}
.prow span{font-size:14px}
table.mc{width:100%;border-collapse:collapse;font-size:14px}
table.mc th{font-weight:600;color:var(--muted);padding:6px 2px;text-align:center}
table.mc th:first-child,table.mc td:first-child{text-align:left}
table.mc td{padding:8px 2px;border-top:1px solid var(--line);text-align:center}
table.mc td.dot{color:var(--accent);font-size:18px;line-height:1}
table.mc td.cnt{font-weight:700}
table.mc td.cnt.bad{color:var(--danger)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font:800 italic 44px/1 var(--display)}
.stat span{color:var(--muted);font-size:14px}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12.5px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:4px}
.bars i.zero{background:var(--line)}
.bars b{color:var(--fg);font-size:14px}
.hist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hist:first-of-type{border-top:0}
.hist span{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 4px;font-weight:700;font-size:15px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px}
.days button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 0;font-weight:700;cursor:pointer}
.days button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.warn{color:var(--danger);font-size:14px;margin:4px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{appearance:none;width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:25px}
.tip{padding:12px 0;border-top:1px solid var(--line)}
.tip:first-of-type{border-top:0}
.tip strong{display:block}
.tip span{color:var(--muted);font-size:15px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--soft);color:var(--softfg);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;font-weight:600}
.lv5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.lv5 button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 0;font:800 italic 22px var(--display);cursor:pointer}
.lv5 button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.tf{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;margin-bottom:8px;font-size:15px}
.tf input{background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:11px;font-size:16px;width:100%}
/* Sammlung */
.search{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font-size:16px;margin-bottom:10px}
.hs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -16px 4px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--fg)}
.hs button.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.hs button.gear.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.lbl{font-size:13px;color:var(--muted);margin:8px 0 4px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.xc .figbox{padding:2px 4px}
.xc strong{font-size:14.5px;line-height:1.2;padding:0 4px}
.xc .tg{display:flex;flex-wrap:wrap;gap:4px;padding:0 4px 4px}
.tag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.tag.g{background:var(--fg);color:var(--bg)}
.xc .btn{margin:2px 4px 4px;padding:9px 10px;font-size:15px}
/* Sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh .x{float:right;border:0;background:var(--surface2);width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer}
.sh h3{font:800 italic 32px/1 var(--display);text-transform:uppercase;margin:4px 0 4px;padding-right:46px}
.lvl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.lvl:first-of-type{border-top:0}
.lvl span{color:var(--muted);white-space:nowrap}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:8px;font-size:15.5px;font-weight:600;cursor:pointer}
.opt span{color:var(--muted);font-weight:400;font-size:14px}
/* Foto-Darstellung mit weicher Überblendung */
.pic{position:relative;overflow:hidden;display:block;background:var(--studio)}
.pic .zz{position:absolute;inset:0;animation:zoomz var(--d,4.4s) ease-in-out infinite}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-mask-image:radial-gradient(ellipse 76% 82% at 50% 52%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 76% 82% at 50% 52%,#000 62%,transparent 100%)}
.pic img.b{opacity:0;animation:fb var(--d,4.4s) ease-in-out infinite}
@keyframes fb{0%,10%{opacity:0}40%,58%{opacity:1}88%,100%{opacity:0}}
@keyframes zoomz{0%,10%{transform:scale(1)}40%,58%{transform:scale(1.045)}88%,100%{transform:scale(1)}}
.figbox .pic{aspect-ratio:16/10;border-radius:10px}
.stage .pic{width:100%;height:100%;background:none}
@media (prefers-reduced-motion:reduce){.pic .zz,.pic img.b{animation:none!important}}
/* Player */
.stage{position:relative;background:var(--studio);border-radius:26px;height:min(50vh,460px);min-height:330px;overflow:hidden;margin:6px 0 10px;padding:58px 10px 118px}
.stage .fig{width:100%;height:100%;aspect-ratio:auto;background:none}
.circ{position:absolute;top:12px;width:46px;height:46px;border-radius:50%;background:rgba(58,64,76,.6);color:#fff;display:grid;place-items:center;border:0;text-decoration:none}
.circ.r{right:12px}
.setp{position:absolute;top:18px;left:16px;background:rgba(58,64,76,.6);color:#fff;font-size:13.5px;font-weight:700;padding:6px 12px;border-radius:99px}
.ov{position:absolute;left:20px;bottom:12px;right:20px;color:#10131a}
.ov .reps{font:800 italic 58px/1 var(--display)}
.ov .reps small{font:600 22px var(--body)}
.ov .nm{font:600 21px/1.2 var(--body);margin:2px 0 0}
.ov .tmr{font:800 italic 60px/1 var(--display);margin-top:4px}
.stick{position:sticky;bottom:0;padding:14px 0 4px;background:linear-gradient(to bottom,transparent,var(--bg) 38%)}
#player{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#player[hidden]{display:none}
.pl{max-width:560px;margin:0 auto;padding:14px 16px 24px;min-height:100%;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ph button{border:0;background:var(--surface2);width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer;flex:none}
.ph div{flex:1}
.ph strong{display:block;font:800 italic 22px/1 var(--display);text-transform:uppercase}
.ph span{color:var(--muted);font-size:13.5px}
.segs{display:flex;gap:5px;margin-bottom:14px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.segs b{display:block;height:100%;background:var(--accent)}
.pname{font:800 italic 34px/1 var(--display);text-transform:uppercase;margin:4px 0 2px}
.pill{display:flex;gap:6px;margin:12px 0 2px}
.pill i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.pill i.done{background:var(--fg)}
.pill i.cur{background:var(--accent)}
.target{text-align:center;margin:8px 0 2px}
.target .big{font:800 italic 92px/1 var(--display)}
.target .u{font:700 22px var(--display);color:var(--muted);text-transform:uppercase}
.cues{margin:12px 0 0;padding:0;list-style:none;color:var(--muted);font-size:15px}
.cues li{padding:5px 0 5px 16px;position:relative}
.cues li::before{content:'';position:absolute;left:0;top:14px;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.spacer{flex:1;min-height:8px}
.pbtns{display:flex;gap:10px;margin-top:14px}
.pbtns .btn{margin-top:0}
.rest{text-align:center;padding-top:6px}
.rest .lbl2{font:700 22px var(--display);color:var(--muted);text-transform:uppercase}
.rest .big{font:800 italic 128px/1 var(--display);color:var(--accent)}
.next{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.next .mini{width:112px}
.next span{color:var(--muted);font-size:14px}
.next strong{display:block;line-height:1.2}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px;z-index:40}
.dlg div{background:var(--surface);border-radius:14px;padding:20px;max-width:360px;width:100%}
.dlg h3{font:800 italic 28px var(--display);text-transform:uppercase;margin:0 0 6px}
.done-h{font:800 italic 64px/.92 var(--display);text-transform:uppercase;margin:14px 0 6px}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}.hot{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--body1)"/><stop offset="1" style="stop-color:var(--body2)"/></linearGradient><linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--skin1)"/><stop offset="1" style="stop-color:var(--skin2)"/></linearGradient></defs></svg>
<div class="app" id="view"></div>
<nav class="nav"><div id="nav"></div></nav>
<div id="sheet" hidden></div>
<div id="player" hidden></div>
<div id="toast"></div>

<script>
/* ================= Hilfsfunktionen ================= */
const $=(s,r=document)=>r.querySelector(s);
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const DAYS_LONG=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayIdx=()=>(new Date().getDay()+6)%7;

 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const M=14*(e.a.s||1);
 for(const P of [e.a,e.b])for(const k of ['H','N','P','E','W','K','A','F','K2','A2','F2']){const v=P[k];if(!v)continue;
  x0=Math.min(x0,v[0]-M);x1=Math.max(x1,v[0]+M);y0=Math.min(y0,v[1]-M);y1=Math.max(y1,v[1]+M)}
 if(e.prop){const b=PB[e.prop];x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[2]);y1=Math.max(y1,b[3])}
 if(!e.nofloor){x0-=12;x1+=12;y1=Math.max(y1,134)}
 x0-=6;x1+=6;y0-=4;y1+=4;
 let w=x1-x0,h=y1-y0;const ar=1.6;
 if(w/h<ar){const nw=h*ar;x0-=(nw-w)/2;w=nw}else{const nh=w/ar;y0-=(nh-h);h=nh}
 return e.vb=[x0,y0,w,h]}
function figDraw(id,cls){const e=EX[id],vb=fitVB(e),mx0=vb[0]+4,mx1=vb[0]+vb[2]-4;
 const mat=e.nofloor?'':`<ellipse class="shd" cx="${F1((mx0+mx1)/2)}" cy="132" rx="${F1((mx1-mx0)/2*.97)}" ry="3.4"/><polygon class="mat" points="${F1(mx0+18)},116 ${F1(mx1-18)},116 ${F1(mx1)},131 ${F1(mx0)},131"/>`;
 return `<svg class="fig ${cls||''}" viewBox="${vb.map(F1).join(' ')}" data-ex="${id}" role="img" aria-label="Animation: ${e.n}">
 ${mat}${PROPS[e.prop]||''}${layers(e,0).map(([c],i)=>`<path class="${c}" data-i="${i}"/>`).join('')}</svg>`}

function figSVG(id,cls){const p=PHOTOS[id];if(!p)return figDraw(id,cls);
 const e=EX[id],d=((e.per||3.4)*1.25).toFixed(2),alt='Übung: '+e.n;
 if(p.length<2||e.t==='h')return `<div class="pic ${cls||''}" role="img" aria-label="${alt}"><div class="zz" style="animation:none"><img src="${p[0]}" alt=""></div></div>`;
 return `<div class="pic ${cls||''}" role="img" aria-label="${alt}" style="--d:${d}s"><div class="zz"><img class="a" src="${p[0]}" alt=""><img class="b" src="${p[1]}" alt=""></div></div>`}
let FIGS=[];
const IO=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(en=>{const f=en.target._f;if(f)f.vis=en.isIntersecting}),{rootMargin:'120px'}):null;
function hydrate(root){root.querySelectorAll('svg.fig:not([data-h])').forEach(svg=>{svg.dataset.h=1;
 const els=[];svg.querySelectorAll('[data-i]').forEach(el=>els[+el.dataset.i]=el);
 const f={svg,e:EX[svg.dataset.ex],els,t0:performance.now(),vis:!IO,still:false};svg._f=f;FIGS.push(f);
 if(IO)IO.observe(svg);draw(f,0)})}
function draw(f,t){layers(f.e,t).forEach(([c,d],i)=>{if(f.els[i])f.els[i].setAttribute('d',d)})}
const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let lastT=0;
function frame(now){
 requestAnimationFrame(frame);
 if(now-lastT<32)return;lastT=now;
 FIGS=FIGS.filter(f=>{if(f.svg.isConnected)return true;if(IO)IO.unobserve(f.svg);return false});
 for(const f of FIGS){const e=f.e;if(!f.vis)continue;
  if(e.t==='h'||REDUCED){if(!f.still){draw(f,0);f.still=true}continue}
  const ph=((now-f.t0)/1000)/(e.per||3.4)*Math.PI*2;
  draw(f,.5-.5*Math.max(-1,Math.min(1,Math.cos(ph)*1.5)))}}
requestAnimationFrame(frame);

/* ================= Bausteine ================= */
const chips=(e)=>`<div class="chips">${e.p.map(m=>`<span class="chip p">${m}</span>`).join('')}${e.s.filter(x=>!e.p.includes(x)).map(m=>`<span class="chip">${m}</span>`).join('')}</div>`;
const chipsM=arr=>`<div class="chips">${arr.map(m=>`<span class="chip p">${m}</span>`).join('')}</div>`;
function wList(w,edit){return exList(w).map((id,s)=>`<div class="exrow">${figSVG(id,'mini')}<div class="tx"><strong>${vname(id)}</strong><span>${SETS} Sätze, ${tgt(id)}</span></div>${edit?`<button class="swap" data-act="swap" data-w="${w}" data-s="${s}" aria-label="Übung tauschen">Tauschen</button>`:''}</div>`).join('')}
function weekStrip(){const pm=plan(),ti=todayIdx();
 return `<div class="week">${DAYS.map((d,i)=>{const p=pm[i]!==undefined,done=isDone(key(dateOfWeekday(i)));
  return `<div class="wd ${done?'done':''} ${!p&&!done?'rest':''} ${i===ti?'today':''}"><b>${done?'✓':p?pm[i]+1:'–'}</b>${d}</div>`}).join('')}</div>`}
function toast(m){const t=$('#toast');t.innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>{t.innerHTML=''},2400)}
const ytLink=id=>'https://www.youtube.com/results?search_query='+encodeURIComponent(EX[id].n+' richtig ausführen');
const gearTags=e=>e.g.map(g=>`<span class="tag g">${GEARN[g]}</span>`).join('');

/* ================= Ansichten ================= */
function vHeute(){
 const ti=todayIdx(),pm=plan(),dk=key(new Date()),w=pm[ti],n=new Date();
 let out=`<div class="top"><div class="brand">Feierabend<i>Fit</i></div><div class="date">${DAYS_LONG[ti]}, ${pad(n.getDate())}.${pad(n.getMonth()+1)}.</div></div>${weekStrip()}${sugBanner()}`;
 if(w!==undefined){
  const done=isDone(dk,w);
  out+=`<div class="card hero"><h1 class="h1">${done?'Heute erledigt':W[w].t}</h1>
   <p class="sub" style="margin-bottom:6px">${done?'Stark! Deine Muskeln arbeiten jetzt am Aufbau. Ab unter die Dusche.':'Training '+(w+1)+' von 5, vor dem Duschen.'}</p>${chipsM(wMu(w))}
   <div class="meta"><span><b>15</b>Min</span><span><b>5</b>Übungen</span><span><b>${SETS}</b>Sätze</span><span><b>L${S.level+1}</b>${LEVELS[S.level].n}</span></div>
   <button class="btn" data-act="start" data-w="${w}">${done?'Nochmal trainieren':'Workout starten'}</button></div>
   <div class="card">${wList(w,true)}</div>`;
 }else{
  const nx=nextUndone();
  out+=`<div class="card hero"><h1 class="h1">Ruhetag</h1><p class="sub">Muskeln wachsen in der Pause, nicht im Training. Schlaf gut und iss genug Eiweiß.</p>
   <button class="btn ghost" data-act="start" data-w="${nx}">Trotzdem trainieren: ${W[nx].t}</button></div>`;
 }
 const wkKeys=DAYS.map((_,j)=>key(dateOfWeekday(j)));
 const missed=[];for(let i=0;i<ti;i++){if(pm[i]!==undefined&&!isDone(wkKeys[i])&&!S.log.some(l=>l.w===pm[i]&&wkKeys.includes(l.d)))missed.push(i)}
 if(missed.length){const i=missed[0];out+=`<div class="banner"><span>Verpasst: ${DAYS_LONG[i]}, ${W[pm[i]].t}</span><button class="btn small" data-act="start" data-w="${pm[i]}">Nachholen</button></div>`}
 return out}

function vPlan(){
 const pm=plan(),assigned=Object.values(pm);
 let out=`<div class="top"><div class="brand">Wochen<i>plan</i></div></div><p class="sub">Tippe auf einen Tag, um die Übungen zu sehen oder zu tauschen.</p>`;
 out+=DAYS_LONG.map((dn,i)=>{const w=pm[i];
  if(w===undefined)return `<div class="prow"><b>${DAYS[i]}</b><div><strong>Ruhetag</strong><span>Erholung, hier wachsen die Muskeln</span></div></div>`;
  const done=isDone(key(dateOfWeekday(i)),w);
  return `<details class="card plan"><summary><b class="dn">${DAYS[i]}</b><div><strong>${W[w].t}${S.custom[w]?' (angepasst)':''}</strong><span>${wMu(w).join(', ')}</span></div>${done?'<em class="ok">✓</em>':''}</summary><div class="body">${wList(w,true)}${S.custom[w]?`<button class="btn ghost" data-act="restore" data-w="${w}">Standard-Übungen wiederherstellen</button>`:''}<button class="btn" data-act="start" data-w="${w}">Workout starten</button></div></details>`}).join('');
 const heads=[0,1,2,3,4].map(k=>{const i=Object.keys(pm).find(x=>pm[x]===k);return i!==undefined?DAYS[i]:'T'+(k+1)});
 out+=`<h2 class="h2">Muskel-Check</h2><div class="card"><table class="mc"><tr><th></th>${heads.map(h=>`<th>${h}</th>`).join('')}<th>pro Woche</th></tr>
 ${CATS.map(m=>{const c=assigned.filter(k=>wMu(k).includes(m)).length;

 if(last.length<2)return 0;
 if(last.every(l=>l.r==='easy')&&S.level<4)return 1;
 if(last.every(l=>l.r==='hard')&&S.level>0)return -1;return 0}
function scoreTest(p,s,pl){const sc=(v,th)=>{let l=0;th.forEach((t,i)=>{if(v>=t)l=i+1});return l};
 const a=sc(p,[3,8,16,26]),b=sc(s,[20,35,50,65]),c=sc(pl,[20,45,90,150]);

 return `<div class="banner"><span>${g>0?'Deine letzten 2 Workouts waren zu leicht.':'Deine letzten 2 Workouts waren zu schwer.'} Level „${LEVELS[S.level+g].n}“ ausprobieren?</span><button class="btn small" data-act="lvl-apply" data-v="${g}">Ja</button></div>`}

function putEx(w,s,id){

let PL=null,AC=null,WL=null;
function beep(f,d){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f||880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.18,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.12));o.start();o.stop(AC.currentTime+(d||.12))}catch(e){}}
function startWorkout(w){
 const steps=[];exList(w).forEach((id,ei)=>{for(let s=0;s<SETS;s++)steps.push({id,ei,s})});
 PL={w,steps,i:0,phase:'ready',end:0,paused:false,left:0,t0:Date.now(),confirm:false};
 try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{WL=l}).catch(()=>{})}catch(e){}
 beep(660,.1);setPhase('ready',5)}
function setPhase(ph,secs){PL.phase=ph;PL.paused=false;PL.end=secs?Date.now()+secs*1000:0;renderPlayer()}
function beginWork(){const st=PL.steps[PL.i];const e=EX[st.id];PL.ws=Date.now();
 if(e.t==='h')setPhase('work',lvx(st.id)[1]);else setPhase('work',0)}
function finishSet(){
 if(PL.i>=PL.steps.length-1){PL.i=PL.steps.length;return finishWorkout()}
 const cur=PL.steps[PL.i],nxt=PL.steps[PL.i+1];PL.i++;
 beep(1000,.2);setPhase('rest',nxt.ei===cur.ei?LEVELS[S.level].r1:LEVELS[S.level].r2)}
function finishWorkout(){
 const dur=Math.round((Date.now()-PL.t0)/1000);
 S.log.push({d:key(new Date()),w:PL.w,dur});save();
 beep(660,.15);setTimeout(()=>beep(880,.15),180);setTimeout(()=>beep(1175,.3),360);
 PL.dur=dur;setPhase('done',0)}
function closePlayer(){PL=null;try{if(WL)WL.release()}catch(e){}WL=null;renderPlayer();render()}
function advance(){if(!PL)return;if(PL.phase==='ready'||PL.phase==='rest'){beep(1000,.25);beginWork()}else if(PL.phase==='work'){finishSet()}}
const fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
setInterval(()=>{
 if(!PL)return;
 const tm=$('#tm');
 if(PL.phase==='work'&&EX[PL.steps[PL.i].id].t==='r'){if(tm){const t=fmt(Math.floor((Date.now()-PL.ws)/1000));if(tm.textContent!==t)tm.textContent=t}return}
 if(!PL.end||PL.paused)return;
 const left=Math.ceil((PL.end-Date.now())/1000);
 if(tm){const txt=PL.phase==='work'?fmt(Math.max(left,0)):String(Math.max(left,0));if(tm.textContent!==txt){tm.textContent=txt;if(left>0&&left<=3)beep(700,.08)}}
 if(left<=0)advance()},200);

function setDots(st){return `<div class="pill">${Array.from({length:SETS},(_,s)=>`<i class="${s<st.s?'done':s===st.s?'cur':''}"></i>`).join('')}</div>`}
const CAM='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3 7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2.5l4-2.5v10l-4-2.5V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
function stageHTML(id,st,over){return `<div class="stage">${figSVG(id)}<span class="setp">Satz ${st.s+1} von ${SETS}</span><a class="circ r" href="${ytLink(id)}" target="_blank" rel="noopener noreferrer" aria-label="Video zur Übung suchen">${CAM}</a><div class="ov">${over}</div></div>`}
function renderPlayer(){
 const el=$('#player');
 if(!PL){el.hidden=true;el.innerHTML='';return}
 el.hidden=false;

 const head=`<div class="ph"><button data-act="p-exit" aria-label="Beenden">✕</button><div><strong>${wk.t}</strong><span>${PL.phase==='done'?'Fertig':'Noch etwa '+Math.max(1,Math.round(remS/60))+' Min'}</span></div></div><div class="segs">${segs}</div>`;
 let body='';
 if(PL.phase==='done'){
  const s=PL.dur;
  body=`<div class="done-h">Geschafft.</div><p class="sub">${wk.t} ist gespeichert. Jetzt unter die Dusche.</p>
   <div class="stats"><div class="stat"><b>${Math.floor(s/60)}:${pad(s%60)}</b><span>Minuten</span></div><div class="stat"><b>${PL.steps.length}</b><span>Sätze</span></div></div>

 }else if(PL.phase==='ready'){

 }else if(PL.phase==='rest'){
  body=`<div class="rest"><div class="lbl2">Pause</div><div class="big" id="tm">${Math.max(0,Math.ceil((PL.end-Date.now())/1000))}</div></div>
   <div class="next">${figSVG(st.id,'mini')}<div><span>Als Nächstes, Satz ${st.s+1} von ${SETS}</span><strong>${vname(st.id)}</strong><span>${tgt(st.id)}</span></div></div>
   <div class="spacer"></div><div class="pbtns"><button class="btn ghost" data-act="p-plus">+15 s</button><button class="btn" data-act="p-next">Weiter</button></div>`;
 }else{
  const c=lvx(st.id);
  const left=Math.max(0,Math.ceil((PL.paused?PL.left:PL.end-Date.now())/1000));
  const over=e.t==='h'
   ?`<div class="reps">${c[1]} Sek.</div><div class="nm">${c[0]}</div><div class="tmr" id="tm">${fmt(left)}</div>`
   :`<div class="reps">${c[1]}x${c[2]?' <small>pro Seite</small>':''}</div><div class="nm">${c[0]}</div><div class="tmr" id="tm">${fmt(Math.max(0,Math.floor((Date.now()-PL.ws)/1000)))}</div>`;
  const btns=e.t==='h'
   ?`<div class="pbtns"><button class="btn ghost" data-act="p-pause">${PL.paused?'Weiter':'Pause'}</button><button class="btn" data-act="p-next">Fertig</button></div>`
   :`<button class="btn" data-act="p-next" style="margin-top:0">Satz erledigt</button>`;
  body=stageHTML(st.id,st,over)+chips(e)+`<ul class="cues">${e.cues.map(c=>`<li>${c}</li>`).join('')}</ul><div class="spacer"></div><div class="stick">${btns}</div>`;
 }
 el.innerHTML=`<div class="pl">${head}${body}</div>`+(PL.confirm?`<div class="dlg"><div><h3>Workout beenden?</h3><p class="sub">Dein Fortschritt in diesem Workout wird nicht gespeichert.</p><div class="pbtns"><button class="btn ghost" data-act="p-no">Weitermachen</button><button class="btn" data-act="p-yes">Beenden</button></div></div></div>`:'');
 hydrate(el)}

/* ================= Klicks ================= */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,d=el.dataset;
 switch(a){
  case 'tab':TAB=d.t;RESET=false;if(TAB!=='ueb')SWAP=null;render();window.scrollTo(0,0);break;
  case 'start':startWorkout(+d.w);break;
  case 'level':setLevel(+d.v);render();break;
  case 'lvl-apply':setLevel(S.level+(+d.v));toast('Level angepasst');render();break;
  case 'test-open':TEST=(TEST&&TEST.open)?null:{open:true};render();break;
  case 'test-run':{const v=id=>parseInt(($(id)||{}).value,10);const p=v('#t1'),q=v('#t2'),r=v('#t3');
   if([p,q,r].some(x=>isNaN(x)||x<0)){toast('Bitte alle drei Werte eintragen');break}
   TEST={open:true,res:scoreTest(p,q,r),vals:[p,q,r]};render();break}
  case 'test-take':setLevel(TEST.res);TEST=null;toast('Level übernommen');render();break;
  case 'fb':{const l=S.log[S.log.length-1];if(l&&PL){l.r=d.v;save();PL.fb=d.v;renderPlayer()}break}
  case 'fit':COL.fit=!COL.fit;render();break;
  case 'theme':S.theme=d.v;save();applyTheme();render();break;
  case 'day':{const i=+d.i,n=S.days.filter(Boolean).length;
   if(!S.days[i]&&n>=5){toast('Maximal 5 Trainingstage');break}
   S.days[i]=S.days[i]?0:1;save();render();break}
  case 'sound':S.sound=S.sound?0:1;save();render();break;
  case 'reset':if(RESET){S.log=[];save();RESET=false;toast('Verlauf gelöscht')}else{RESET=true}render();break;
  case 'cat':COL.cat=d.c;render();break;
  case 'gear':S.gear[d.g]=S.gear[d.g]?0:1;save();render();break;
  case 'info':SHEET={id:d.id,step:'info'};renderSheet();break;
  case 'close-sheet':SHEET=null;renderSheet();break;
  case 'sheet-pick':SHEET.step='w';renderSheet();break;
  case 'sheet-back':SHEET.step='info';renderSheet();break;
  case 'pickw':SHEET.w=+d.w;SHEET.step='s';renderSheet();break;
  case 'pick-back':SHEET.step='w';renderSheet();break;
  case 'puts':{if(putEx(SHEET.w,+d.s,SHEET.id)){SHEET=null;renderSheet();render()}break}
  case 'swap':{const cur=EX[exList(+d.w)[+d.s]];SWAP={w:+d.w,s:+d.s,from:TAB};COL.cat=cur.p[0];COL.q='';TAB='ueb';render();window.scrollTo(0,0);break}
  case 'cancel-swap':TAB=SWAP.from||'plan';SWAP=null;render();break;
  case 'put':{if(SWAP&&putEx(SWAP.w,SWAP.s,d.id)){TAB=SWAP.from||'plan';SWAP=null;SHEET=null;renderSheet();render();window.scrollTo(0,0)}break}
  case 'restore':delete S.custom[+d.w];save();toast('Standard wiederhergestellt');render();break;
  case 'p-next':if(PL){if(PL.phase==='ready'||PL.phase==='rest')beginWork();else if(PL.phase==='work')finishSet()}break;
  case 'p-plus':if(PL&&PL.phase==='rest'){PL.end+=15000}break;
  case 'p-pause':if(PL){if(PL.paused){PL.end=Date.now()+PL.left;PL.paused=false}else{PL.left=PL.end-Date.now();PL.paused=true}renderPlayer()}break;
  case 'p-exit':if(PL){PL.confirm=true;renderPlayer()}break;
  case 'p-no':if(PL){PL.confirm=false;renderPlayer()}break;
  case 'p-yes':case 'p-close':closePlayer();break;
 }
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='q'){COL.q=e.target.value;const g=$('#grid');if(g){g.innerHTML=gridHTML();hydrate(g)}}});
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
